name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contracts
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Same host ports as infra/compose.dev.yml, which the e2e config defaults to.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bilhanah
          POSTGRES_PASSWORD: bilhanah_dev_password
          POSTGRES_DB: bilhanah
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U bilhanah -d bilhanah"
          --health-interval 2s --health-retries 30
      redis:
        image: redis:8.2-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image names must be lowercase.
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only build; pushes to main also publish, tagged with the commit.
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/bilhanah-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/bilhanah-api-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Edge (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/bilhanah-edge:${{ github.sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
